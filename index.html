<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 致我最爱的你</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #150d2e 0%, #2b1a4d 35%, #472a6e 70%, #6b3a7d 100%);
    color: #fff;
    overflow: hidden;
    min-height: 100vh;
    user-select: none;
  }

  /* ---------- 背景装饰：星星 / 月亮 / 花瓣 ---------- */
  .star {
    position: fixed; border-radius: 50%; background: #fff;
    opacity: .2; animation: twinkle ease-in-out infinite; z-index: 0;
  }
  @keyframes twinkle { 50% { opacity: 1; transform: scale(1.4); } }

  .moon {
    position: fixed; top: 6vh; right: 10vw; width: 72px; height: 72px;
    border-radius: 50%; z-index: 0;
    background: radial-gradient(circle at 35% 35%, #fff8e7, #ffe9b8 60%, #f7d794);
    box-shadow: 0 0 40px 12px rgba(255, 236, 179, .35);
  }

  .petal {
    position: fixed; top: -48px; z-index: 1; pointer-events: none;
    animation: fall linear forwards;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.2));
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(112vh) translateX(var(--sway, 40px)) rotate(340deg); }
  }

  /* ---------- 舞台通用 ---------- */
  .stage {
    position: relative; z-index: 2;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  /* 信较长，整页可滚动（隐藏滚动条，保持画面干净） */
  #stage2 {
    height: 100vh; overflow-y: auto;
    justify-content: flex-start; padding-top: 7vh; padding-bottom: 6vh;
    scrollbar-width: none;
  }
  #stage2::-webkit-scrollbar { display: none; }
  .gone { opacity: 0; transform: translateY(-24px); pointer-events: none; transition: all .7s ease; }

  .pre-title {
    font-size: clamp(22px, 5.5vw, 34px); letter-spacing: .18em; font-weight: 400;
    color: #ffe3ef; text-shadow: 0 0 18px rgba(255, 143, 171, .55);
    margin-bottom: 6vh;
  }

  /* ---------- 信封 ---------- */
  .envelope {
    position: relative; width: min(84vw, 340px); aspect-ratio: 8 / 5;
    background: #e58aa8; border-radius: 8px; cursor: pointer;
    box-shadow: 0 24px 70px rgba(255, 105, 180, .35);
    perspective: 700px;
    transition: transform .3s ease;
  }
  .envelope:hover { transform: translateY(-6px) scale(1.02); }
  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 55%;
    background: linear-gradient(180deg, #f2a7c3, #e58aa8);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; z-index: 3;
    transition: transform .8s ease, z-index 0s .4s;
  }
  .envelope.open .flap { transform: rotateX(180deg); z-index: 0; }
  .wax {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: 40px; height: 40px; border-radius: 50%; z-index: 4;
    background: radial-gradient(circle at 35% 35%, #ff6b81, #c0392b);
    color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.3); transition: opacity .3s;
  }
  .envelope.open .wax { opacity: 0; }
  .pocket {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, #f8c8d8, #eb9ab6);
    clip-path: polygon(0 0, 50% 48%, 100% 0, 100% 100%, 0 100%);
    border-radius: 8px;
  }
  .letter-mini {
    position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
    width: 62%; height: 72%; z-index: 1;
    background: linear-gradient(180deg, #fffdf8, #fff3f6);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    transition: transform .9s ease .45s;
  }
  .envelope.open .letter-mini { transform: translateX(-50%) translateY(-125%); }
  .hint {
    margin-top: 6vh; color: #ffd7e5; letter-spacing: .12em;
    font-size: clamp(14px, 4vw, 17px);
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .45; transform: scale(.97); } }

  /* ---------- 信 ---------- */
  #stage2 h1 {
    font-weight: 400; letter-spacing: .12em;
    font-size: clamp(26px, 6.5vw, 42px); margin-bottom: 3.5vh;
    background: linear-gradient(90deg, #ffd1e3, #ff8fab, #ffb3c6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .paper {
    max-width: 620px; width: 100%;
    background: rgba(255, 255, 255, .09);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 20px; padding: clamp(20px, 5vw, 36px);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-align: left;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", "FangSong", serif;
    font-size: clamp(16px, 4.2vw, 19px); line-height: 2; color: #fff2f7;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .3);
  }
  .paper p { min-height: 1.6em; white-space: pre-wrap; }
  .paper .greet { color: #ffd1e3; }
  .paper .poem {
    text-align: center; color: #ffe9c9; letter-spacing: .06em;
    text-shadow: 0 0 12px rgba(255, 214, 150, .35);
  }
  .cursor {
    display: inline-block; width: 2px; height: 1.1em;
    background: #ff8fab; vertical-align: -0.15em; margin-left: 2px;
    animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #finale { margin-top: 3vh; }
  .bigheart {
    font-size: clamp(48px, 12vw, 72px); line-height: 1;
    animation: beat 1s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(255, 107, 129, .6));
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.22); }
    40% { transform: scale(1.05); }
  }
  .final-words { margin-top: 1.5vh; font-size: clamp(17px, 4.5vw, 22px); color: #ffe3ef; letter-spacing: .15em; }
  .sign { margin-top: 1vh; color: #d9c3ef; font-size: clamp(13px, 3.6vw, 15px); letter-spacing: .1em; }

  /* ---------- 点击绽放的小心心 ---------- */
  .pop {
    position: fixed; z-index: 3; pointer-events: none;
    animation: pop .95s ease-out forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.5); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.35); opacity: 0; }
  }

  /* ---------- 音乐按钮 ---------- */
  #musicBtn {
    position: fixed; top: 14px; right: 14px; z-index: 4;
    background: rgba(255, 255, 255, .12); color: #ffe3ef;
    border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px;
    padding: 7px 15px; font-size: 13px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #musicBtn:hover { background: rgba(255, 255, 255, .22); }
</style>
</head>
<body>

<button id="musicBtn" type="button" aria-label="音乐开关">🎵 音乐 开</button>

<div id="stage1" class="stage">
  <div class="moon" aria-hidden="true"></div>
  <h1 class="pre-title">有一封信，等你很久了</h1>
  <div class="envelope" id="envelope" role="button" aria-label="点我拆信">
    <div class="letter-mini">💌</div>
    <div class="flap"></div>
    <div class="pocket"></div>
    <div class="wax">❤</div>
  </div>
  <p class="hint">👉 点一下信封，有东西给你</p>
</div>

<div id="stage2" class="stage" hidden>
  <h1>赠 <span id="herName"></span> 的一封信</h1>
  <div class="paper" id="paper"></div>
  <div id="finale" hidden>
    <div class="bigheart">❤️</div>
    <p class="final-words">山有木兮木有枝，心悦君兮。</p>
    <p class="sign">—— 永远仰慕你的 <span id="myName"></span></p>
  </div>
</div>

<script>
/* ================================================================
   ❤ 改这里就行：名字、想说的话 ❤
   小技巧：以 ◇ 开头的行会按「诗句」居中排版，适合放《诗经》引用
   ================================================================ */
var HER_NAME = "周紫艳";          // ← TA 的名字
var MY_NAME  = "我";              // ← 你的名字，落款会显示「—— 永远仰慕你的 XX」

var LETTER = [
  "亲爱的周同学：",
  "",
  "说实话，我不知道该怎么来描绘你，但和你一起相处的每一刻，都让人非常愉悦。",
  "你是第一个让我出现这种状态的女生。",
  "",
  "今晚的场景，让我想起高中时背过的一首诗——《静女》。",
  "◇静女其姝，俟我于城隅。爱而不见，搔首踟蹰。",
  "◇静女其娈，贻我彤管。彤管有炜，说怿女美。",
  "◇自牧归荑，洵美且异。匪女之为美，美人之贻。",
  "",
  "那时不太懂这首诗里的情感，只会见文生义——我们在城脚下相遇，你送我礼物，我很羞涩；你给我的东西，我都很喜欢，爱屋及乌。",
  "但今天晚上，我有了不一样的理解。",
  "",
  "原来这种未见时的期待、见面后的羞涩、相别时的不舍，这种含而不发的情感，才是最让人回味的。我也终于明白，为什么说《国风》色而不淫。",
  "其实我很想哭——情到深处时，自有泪涌出。不过这不是悲伤的泪水，是喜悦。",
  "",
  "为什么会让我有这种情感呢？我相信你一定听说过这句话：窈窕淑女，君子好逑。",
  "这段时间的交流，从思想上、人文上、风格上，以及从我们的每一次交谈里，我发现：你是极度的温柔与含蓄。",
  "像极春日桃花林中傍晚天边的云彩——既有翩翩粉色随风落，亦有红晕半遮天。怎么能不让人喜爱呢？",
  "在全球80亿人口中遇见你，真的是幸运至极。",
  "",
  "你满足了我对初恋之情的幻想，也满足了我对温柔贤惠的幻想。谢谢你，亲爱的周同学。",
  "",
  "我的情感是复杂的，难以言说。书不尽言，言不尽意，其中滋味，唯有亲身品尝，才知其中的酸甜苦辣。",
  "如果现在就立刻确定关系，我觉得会显得肤浅和庸俗。我想我们再多接触接触——待到桃林结满果，我们再摘取其中的甜蜜，好吗？",
  "",
  "最后，送给老周一首诗，也是《诗经》的第一首。我觉得，只有它能承载我对你的仰慕：",
  "◇关关雎鸠，在河之洲。窈窕淑女，君子好逑。",
  "◇参差荇菜，左右流之。窈窕淑女，寤寐求之。",
  "◇求之不得，寤寐思服。悠哉悠哉，辗转反侧。",
  "◇参差荇菜，左右采之。窈窕淑女，琴瑟友之。",
  "◇参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"
];
/* ================================================================ */

document.getElementById("herName").textContent = HER_NAME;
document.getElementById("myName").textContent = MY_NAME;

/* ---------- 星星 ---------- */
(function () {
  var box = document.createDocumentFragment();
  for (var i = 0; i < 90; i++) {
    var s = document.createElement("div");
    s.className = "star";
    var size = (Math.random() * 2 + 1).toFixed(1);
    s.style.cssText = "left:" + (Math.random() * 100).toFixed(2) + "vw;top:" +
      (Math.random() * 100).toFixed(2) + "vh;width:" + size + "px;height:" + size +
      "px;animation-duration:" + (2 + Math.random() * 3).toFixed(2) +
      "s;animation-delay:" + (Math.random() * 4).toFixed(2) + "s;";
    box.appendChild(s);
  }
  document.body.appendChild(box);
})();

/* ---------- 飘落的花瓣 ---------- */
var FLOWERS = ["🌸", "🌹", "🌺", "🌷", "💮", "✨", "💛"];
function spawnPetal() {
  if (document.querySelectorAll(".petal").length > 26) return;
  var p = document.createElement("div");
  p.className = "petal";
  p.textContent = FLOWERS[Math.floor(Math.random() * FLOWERS.length)];
  p.style.left = (Math.random() * 100).toFixed(2) + "vw";
  p.style.fontSize = (13 + Math.random() * 17).toFixed(0) + "px";
  p.style.animationDuration = (7 + Math.random() * 8).toFixed(2) + "s";
  p.style.setProperty("--sway", (Math.random() * 140 - 70).toFixed(0) + "px");
  p.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
  document.body.appendChild(p);
  p.addEventListener("animationend", function () { p.remove(); });
}
spawnPetal();
setInterval(spawnPetal, 500);

/* ---------- 点击任何地方绽放小心心 ---------- */
var POP_SET = ["❤️", "💗", "🌸", "💖", "✨", "💘"];
document.addEventListener("pointerdown", function (e) {
  if (e.target.closest("#musicBtn") || e.target.closest(".envelope")) return;
  burst(e.clientX, e.clientY);
});
function burst(x, y) {
  for (var i = 0; i < 8; i++) {
    var s = document.createElement("span");
    s.className = "pop";
    s.textContent = POP_SET[Math.floor(Math.random() * POP_SET.length)];
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.fontSize = (14 + Math.random() * 14).toFixed(0) + "px";
    var a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 80;
    s.style.setProperty("--dx", (Math.cos(a) * d).toFixed(0) + "px");
    s.style.setProperty("--dy", (Math.sin(a) * d - 70).toFixed(0) + "px");
    document.body.appendChild(s);
    setTimeout(function (el) { return function () { el.remove(); }; }(s), 1100);
  }
}

/* ---------- 打字机情书 ---------- */
var paper = document.getElementById("paper");
var scroller = document.getElementById("stage2");
function keepAtBottom() { scroller.scrollTop = scroller.scrollHeight; }
var cursor = document.createElement("span");
cursor.className = "cursor";
var typing = false;

function typeLetter() {
  if (typing) return;
  typing = true;
  var li = 0;
  function nextLine() {
    if (li >= LETTER.length) { cursor.remove(); showFinale(); return; }
    var raw = LETTER[li++];
    var isPoem = raw.charAt(0) === "◇";
    var text = isPoem ? raw.slice(1) : raw;
    var p = document.createElement("p");
    if (isPoem) p.className = "poem";
    else if (li === 1) p.className = "greet";
    paper.appendChild(p);
    p.appendChild(cursor);
    keepAtBottom();
    var ci = 0;
    function typeChar() {
      if (ci < text.length) {
        cursor.insertAdjacentText("beforebegin", text.charAt(ci++));
        keepAtBottom();
        setTimeout(typeChar, 35 + Math.random() * 35);
      } else {
        setTimeout(nextLine, text ? 300 : 120);
      }
    }
    typeChar();
  }
  nextLine();
}

function showFinale() {
  var f = document.getElementById("finale");
  f.hidden = false;
  var r = f.getBoundingClientRect();
  [0, 250, 500].forEach(function (t) {
    setTimeout(function () {
      burst(r.left + r.width / 2 + (Math.random() * 160 - 80),
            r.top + 40 + Math.random() * 60);
    }, t);
  });
}

/* ---------- 信封：点开 → 淡出 → 写信 ---------- */
var opened = false;
document.getElementById("envelope").addEventListener("click", function () {
  if (opened) return;
  opened = true;
  this.classList.add("open");
  startMusic(); // 用户手势里启动音乐，浏览器允许
  setTimeout(function () {
    var s1 = document.getElementById("stage1");
    s1.classList.add("gone");
    var s2 = document.getElementById("stage2");
    s2.hidden = false;
    setTimeout(function () {
      s1.style.display = "none";
      typeLetter();
    }, 750);
  }, 1600);
});

/* ---------- 八音盒背景音乐（纯网页合成，无需音乐文件） ---------- */
var NOTES = {
  "D4": 293.66, "E4": 329.63, "F#4": 369.99, "G#4": 415.30, "A4": 440,
  "B4": 493.88, "C#5": 554.37, "D5": 587.33, "E5": 659.25, "F#5": 739.99, "A5": 880
};
/* A 大调温柔琶音：A → F#m → D → E，每 0.5 秒一个音，8 秒循环 */
var MELODY = [
  ["A4", 0], ["C#5", .5], ["E5", 1], ["A5", 1.5],
  ["F#4", 2], ["A4", 2.5], ["C#5", 3], ["F#5", 3.5],
  ["D4", 4], ["F#4", 4.5], ["A4", 5], ["D5", 5.5],
  ["E4", 6], ["G#4", 6.5], ["B4", 7], ["E5", 7.5]
];
var LOOP = 8;
var audioCtx = null, master = null, delayNode = null;
var schedTimer = null, nextTime = 0, musicOn = false;
var musicBtn = document.getElementById("musicBtn");

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  master = audioCtx.createGain();
  master.gain.value = 0.16;
  master.connect(audioCtx.destination);
  delayNode = audioCtx.createDelay();
  delayNode.delayTime.value = 0.45;
  var fb = audioCtx.createGain();
  fb.gain.value = 0.35;
  delayNode.connect(fb); fb.connect(delayNode);
  delayNode.connect(master);
}
function playNote(freq, t) {
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.8, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
  o.connect(g);
  g.connect(master);
  g.connect(delayNode);
  o.start(t); o.stop(t + 1.7);
}
function schedule() {
  if (nextTime < audioCtx.currentTime) nextTime = audioCtx.currentTime + 0.1;
  while (nextTime < audioCtx.currentTime + 1.2) {
    for (var i = 0; i < MELODY.length; i++) {
      playNote(NOTES[MELODY[i][0]], nextTime + MELODY[i][1]);
    }
    nextTime += LOOP;
  }
}
function startMusic() {
  if (!audioCtx) initAudio();
  audioCtx.resume();
  nextTime = audioCtx.currentTime + 0.1;
  if (schedTimer) clearInterval(schedTimer);
  schedTimer = setInterval(schedule, 300);
  musicOn = true;
  musicBtn.textContent = "🎵 音乐 关";
}
musicBtn.addEventListener("click", function () {
  if (musicOn) {
    if (schedTimer) clearInterval(schedTimer);
    if (audioCtx) audioCtx.suspend();
    musicOn = false;
    musicBtn.textContent = "🎵 音乐 开";
  } else {
    startMusic();
  }
});
</script>
</body>
</html>
